<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 740" width="1320" height="740" role="img" aria-label="Target AWS architecture in Tokyo: users reach CloudFront with WAF, which serves web files from S3 and forwards /api through a VPC origin to an internal load balancer in private subnets. ECS Fargate tasks in private subnets use RDS MySQL in isolated subnets and reach the internet through a NAT gateway in the public subnets.">
