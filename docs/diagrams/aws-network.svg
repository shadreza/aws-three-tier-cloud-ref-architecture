<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 752" width="1240" height="752" role="img" aria-label="Step 02 network in Tokyo: a VPC with public, private and isolated subnets in two Availability Zones. The public subnets hold only the NAT gateway. The internal load balancer and the ECS tasks are private, RDS is isolated with no way out.">
