<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="Step 02 network in Tokyo: a VPC with public, private and isolated subnets in two Availability Zones. The internet gateway serves the public subnets, a NAT gateway gives the private subnets outbound access, and the isolated subnets have no way out.">
