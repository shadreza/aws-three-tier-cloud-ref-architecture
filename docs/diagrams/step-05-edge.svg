<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 600" width="1380" height="600" role="img" aria-label="Step 05 edge: users reach CloudFront, checked by WAF. The default behavior serves the web app from a private S3 bucket through OAC; /api/* goes through a VPC origin to the internal load balancer and the API tasks.">
